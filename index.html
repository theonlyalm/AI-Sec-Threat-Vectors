<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OWASP LLM Security Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/neovis.js@2.1.0/dist/neovis.js"></script>
  <style>
    body { margin: 0; padding: 0; background-color: #1a1a1a; color: #fff; font-family: sans-serif; }
    #viz { width: 100vw; height: 100vh; }
    #status { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(0,0,0,0.85); padding: 12px 18px; border-radius: 6px; border: 1px solid #444; }
  </style>
</head>
<body>
  <div id="status">Connecting to Neo4j...</div>
  <div id="viz"></div>

  <script>
    const statusEl = document.getElementById("status");
    const NeoVisClass = window.NeoVis?.default || window.NeoVis?.NeoVis || window.NeoVis || window.Neovis;

    const config = {
      containerId: "viz",
      neo4j: {
        // Changed neo4j+s:// to neo4j:// to prevent encryption conflict in Neovis v2
        serverUrl: "neo4j://e055a0f8.databases.neo4j.io",
        serverUser: "neo4j",
        serverPassword: "hQNrOYYvov-U2R0SXKHBI4-XGSnjzXm1kzu3ZFKSzgk" 
      },
      labels: {
        Vulnerability: { label: "code", caption: "name" },
        EntryPoint: { label: "name" },
        CloudProvider: { label: "name" },
        CloudService: { label: "name" },
        Feature: { label: "name" }
      },
      relationships: {
        EXPOSED_VIA: { caption: false },
        MANIFESTS_IN: { caption: false },
        FEATURE_OF: { caption: false },
        PROVIDED_BY: { caption: false }
      },
      initialQuery: "MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 300"
    };

    try {
      const viz = new NeoVisClass(config);
      viz.registerOnEvent("completed", () => { statusEl.style.display = "none"; });
      viz.registerOnEvent("error", (error) => {
        statusEl.style.color = "#ff6b6b";
        statusEl.innerHTML = `<strong>Neo4j Connection Error:</strong><br>${error}`;
      });
      viz.render();
    } catch (err) {
      statusEl.style.color = "#ff6b6b";
      statusEl.innerHTML = `<strong>Initialization Error:</strong> ${err.message}`;
    }
  </script>
</body>
</html>
