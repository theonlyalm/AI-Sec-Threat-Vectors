<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OWASP LLM Top 10 Cloud Security Graph</title>
  <!-- Load Neovis.js directly from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/neovis.js@2.1.0/dist/neovis.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }
    #viz {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="viz"></div>

  <script>
    const config = {
      containerId: "viz",
      neo4j: {
        serverUrl: "neo4j+s://e055a0f8.databases.neo4j.io",
        serverUser: "neo4j",
        serverPassword: "hQNrOYYvov-U2R0SXKHBI4-XGSnjzXm1kzu3ZFKSzgk"
      },
      labels: {
        Vulnerability: {
          label: "code",
          caption: "name"
        },
        EntryPoint: {
          label: "name"
        },
        CloudProvider: {
          label: "name"
        },
        CloudService: {
          label: "name"
        },
        Feature: {
          label: "name"
        }
      },
      relationships: {
        EXPOSED_VIA: {
          caption: false
        },
        MANIFESTS_IN: {
          caption: false
        },
        FEATURE_OF: {
          caption: false
        },
        PROVIDED_BY: {
          caption: false
        }
      },
      initialQuery: "MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 500"
    };

    const viz = new Neovis.js(config);
    viz.render();
  </script>
</body>
</html>
